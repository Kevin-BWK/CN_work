[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packet-analyzer"
version = "0.1.0"
description = "Computer networks course project: local packet capture and analysis."
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials==6.12.0",
    "pyqtgraph==0.14.0",
    "scapy==2.8.0",
    "psutil==7.2.2",
]

[project.scripts]
packet-analyzer = "packet_analyzer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
